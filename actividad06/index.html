<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrograWEB | Registro Evento</title>
</head>
<body>
    <h1>Registro de Participantes - Evento Universitario</h1>

    <form action="" method="post">
        <!-- Campo oculto para enviar identificador interno -->
        <input type="hidden" name="id_evento" value="EVT-2026">

        <!-- Nombre completo -->
        <label for="nombre">Nombre Completo</label>
        <br>
        <input type="text" name="nombre" id="nombre" required placeholder="Escribe tu nombre completo">
        <br>
        <br>

        <!-- Correo electrónico -->
        <label for="correo">Correo Electrónico</label>
        <br>
        <input type="email" name="correo" id="correo" required placeholder="correo@ejemplo.com">
        <br>
        <br>

        <!-- Edad -->
        <label for="edad">Edad</label>
        <br>
        <input type="number" name="edad" id="edad" required min="15" max="99">
        <br>
        <br>

        <!-- Fecha de nacimiento -->
        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
        <br>
        <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" required>
        <br>
        <br>

        <!-- Carrera (lista desplegable) -->
        <label for="carrera">Carrera</label>
        <br>
        <select name="carrera" id="carrera" required>
            <option value="">-- Selecciona una carrera --</option>
            <option value="Licenciatura en Tecnología de la Información">Licenciatura en Tecnología de la Información</option>
            <option value="Licenciatura en Administración">Licenciatura en Administración</option>
            <option value="Licenciatura en Contabilidad Pública">Licenciatura en Contabilidad Pública</option>
            <option value="Licenciatura en Administración Financiera">Licenciatura en Administración Financiera</option>
        </select>
        <br>
        <br>

        <!-- Turno de asistencia -->
        <label>Turno de Asistencia</label>
        <br>
        <input type="radio" name="turno" id="matutino" value="Matutino" required>
        <label for="matutino">Matutino</label>
        <br>
        <input type="radio" name="turno" id="vespertino" value="Vespertino" required>
        <label for="vespertino">Vespertino</label>
        <br>
        <br>

        <!-- Aceptación de términos -->
        <input type="checkbox" name="terminos" id="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label>
        <br>
        <br>

        <!-- Botones de enviar y limpiar -->
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">
    </form>
</body>
</html>
